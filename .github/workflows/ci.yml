name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package invariant (installs display as @fookhsu/pi-btw)
        run: node scripts/check-package.mjs

      - name: Install dependencies
        run: npm ci

      - name: Extension loads through pi loader
        run: node scripts/smoke-load.mjs
